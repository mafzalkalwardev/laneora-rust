[workspace]
resolver = "2"
members = [
    "crates/laneora-core",
    "crates/laneora-server",
    "crates/laneora-proxy",
    "crates/laneora-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
