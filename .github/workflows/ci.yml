name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the Windows launcher
        run: cargo build -p laneora-desktop --release
        env:
          LANEORA_DATA_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
